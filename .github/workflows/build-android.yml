name: reVC Android

# All repository workflows are intentionally manual-only. Use Actions > reVC
# Android > Run workflow and select the branch to build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: sdkmanager "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        working-directory: android/launcher
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.variant }} APK
        working-directory: android/launcher
        run: ./gradlew --no-daemon --stacktrace --build-cache assemble${{ matrix.variant == 'debug' && 'Debug' || 'Release' }}

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: revc-${{ matrix.variant }}
          path: android/launcher/app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk
          if-no-files-found: error
          retention-days: 14
